name: metafeedergiphy

# =============================================================================
# MetaFeeder · Giphy — GIFs for MetaMesh.
#
# Opt-in: soft-skips (healthy, answers nothing) unless GIPHY_API_KEY is set.
# Split out of the former MetaFeeder · Commons app (one provider per app).
#
# It needs, over the shared `pcs` network:
#   - the **MetaGateway** app — which must list this feeder's URL
#     (`http://metafeedergiphy-feeder:8080`) in its feeders config so it gets discovered.
#     Discovery is startup-only, so restart the gateway afterwards.
#
# Everything is scoped under the `metafeedergiphy-*` prefix + the per-stack `metafeedergiphy` network +
# /DATA/AppData/metafeedergiphy/ data root, so it installs beside the other Meta* apps with
# zero collisions.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # metafeedergiphy-feeder — the giphy feeder. Needs a Giphy API key.
  # ---------------------------------------------------------------------------
  metafeedergiphy-feeder:
    image: ghcr.io/worph/meta-feeder-giphy:1.0.0
    cpu_shares: 30
    container_name: metafeedergiphy-feeder
    hostname: metafeedergiphy-feeder
    restart: unless-stopped
    user: "0:0"
    expose:
      - 8080
    environment:
      RUST_LOG: "info,meta_feeder=info"
      META_FEEDER_STATE_DIR: "/data/meta-feeder"
      # Giphy is opt-in. Blank → the feeder soft-skips. This image has no config-UI
      # field for the key yet, so it is read from the environment.
      GIPHY_API_KEY: "${GIPHY_API_KEY:-}"
      TZ: "$TZ"
    volumes:
      # Persist feeder config.json + redb cache so it survives recreate.
      - ${DATA_ROOT:-/DATA}/AppData/metafeedergiphy/state:/data/meta-feeder:rw
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - pcs
networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true

x-casaos:
  architectures:
    - amd64
    - arm64
  author: Worph Team
  category: Media
  developer: Aptero Team

  description:
    en_us: |
      **Giphy for the MetaMesh network.**

      MetaFeeder · Giphy bridges **Giphy** GIFs into MetaMesh. It needs a Giphy API
      key; without one it stays healthy and simply finds nothing.
      **Requires:** **MetaGateway** — its meta-core stores the resolved records and
      announces them to the swarm. The gateway must list this feeder in its config.
    fr_fr: |
      **Giphy pour le réseau MetaMesh.**

      MetaFeeder · Giphy connecte les GIFs **Giphy** à MetaMesh. Nécessite une clé
      d'API Giphy ; sans elle, il reste sain et ne trouve rien. **Nécessite** l'app
      **MetaGateway**.
  tagline:
    en_us: Giphy GIFs for MetaMesh (API key required)
    fr_fr: GIFs Giphy pour MetaMesh (clé d'API requise)

  title:
    en_us: MetaFeeder · Giphy

  icon: https://cdn.jsdelivr.net/gh/Worph/MetaAppStore@main/Apps/MetaFeederGiphy/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/Worph/MetaAppStore@main/Apps/MetaFeederGiphy/thumbnail.png

  store_app_id: metafeedergiphy
  is_uncontrolled: false

  tips:
    before_install:
      en_us: |
        **Install order:** install **MetaGateway** first (its meta-core stores and
        announces what this feeder finds).

        **After installing this app:** in **MetaGateway**, add this feeder from the
        dashboard's *Add a feeder* box — name `giphy-feeder`, URL `http://metafeedergiphy-feeder:8080`.
        The gateway restarts itself: feeder discovery is startup-only.

        **API key:** set `GIPHY_API_KEY` in this app's environment (developers.giphy.com),
        then restart the app. Without it the feeder soft-skips.
        **No web UI of its own:** configure it from the **MetaGateway** dashboard → this feeder → *configure* (the gateway proxies this feeder's config page, behind the gateway's login).

# Maison (Yundera dashboard) configuration. Read in preference to x-casaos.
# schema_version 2 is required for `folders`: an older Maison refuses the app
# outright rather than starting it without its directories.
x-compose-app:
  schema_version: 2
  # Created and chowned by Maison before any image is pulled, before any hook
  # runs and before the containers start — on the first boot and every one after.
  # Compose would otherwise create a missing bind source as a root-owned dir.
  folders:
    - path: /DATA/AppData/metafeedergiphy/state
      user: $PUID
      group: $PGID
