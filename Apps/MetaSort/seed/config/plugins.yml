# Container plugins meta-sort spawns. Read at startup only: restart
# metasort-app after editing.
#
# Not enabled by default: tmdb and filename-parser (cache filenames are content
# hashes, so a parsed filename would overwrite a gateway record's better
# identity) and full-hash (reads a multi-GB file end to end on the peer that
# is streaming it).

defaults:
  resources:
    memory: 256m
    cpus: 0.5
  timeout: 60000

plugins:
  file-info:
    enabled: true
    image: ghcr.io/worph/metamesh-plugin-file-info:1.0.1
    instances: 1
    resources:
      memory: 128m
      cpus: 0.25

  ffmpeg:
    enabled: true
    image: ghcr.io/worph/metamesh-plugin-ffmpeg:1.0.0
    instances: 1
    resources:
      memory: 512m
      cpus: 1.0

  subtitle:
    enabled: true
    image: ghcr.io/worph/metamesh-plugin-subtitle:1.0.1
    instances: 1
    resources:
      memory: 128m
      cpus: 0.25

  subtitle-extractor:
    enabled: true
    image: ghcr.io/worph/metamesh-plugin-subtitle-extractor:1.0.1
    instances: 1
    resources:
      memory: 512m
      cpus: 1.0
    timeout: 300000  # one full sequential read of the video over WebDAV

  still-extractor:
    enabled: true
    image: ghcr.io/worph/metamesh-plugin-still-extractor:1.0.1
    instances: 1
    resources:
      memory: 512m
      cpus: 1.0
    timeout: 300000  # one HTTP seek + decode per candidate offset
