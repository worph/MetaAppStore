name: metapluginopensubtitles

# =============================================================================
# MetaPlugin · OpenSubtitles — the `opensubtitles` enrichment plugin, as a standalone app.
#
# A MetaMesh enrichment plugin is a HEADLESS worker: it speaks the four-verb
# plugin HTTP contract (`/manifest`, `/health`, `/configure`, `/process`) and
# nothing else. There is no dashboard — the web UI on this tile is the plugin's
# own `/manifest`, which is how you confirm it is alive and what version it is.
#
# ⚠ WHAT CONSUMES IT. A MetaFeeder's enrichment sidecar slot: set
# `OPENSUBTITLES_PLUGIN_URL` on the feeder to `http://metapluginopensubtitles-plugin:8080` and it uses this
# shared instance instead of its own bundled copy. (The feeder SDK otherwise
# DERIVES the sidecar URL from its own hostname, so the explicit variable is
# what makes sharing possible at all.)
# **NOT MetaSort**: MetaSort starts its own plugin containers from its
# `plugins.yml` (`image:`) and has no URL slot, so installing this app does
# not add a plugin to MetaSort.
#
# ⚠ IT HOLDS NO CREDENTIALS. The caller POSTs `/configure` with its own key
# (TMDB token, OpenSubtitles account) before use. Two consumers sharing one
# instance are last-writer-wins on that config — same key, no problem; different
# keys, install a second copy.
#
# Everything is scoped under the `metapluginopensubtitles-*` prefix + the per-stack `metapluginopensubtitles`
# network, so it installs beside the other Meta* apps with zero
# collisions.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # metapluginopensubtitles-plugin — the plugin. Listens on 8080; joined to `pcs` so any
  # consumer on the box can reach it by name. Default queue: background.
  # ---------------------------------------------------------------------------
  metapluginopensubtitles-plugin:
    image: ghcr.io/worph/metamesh-plugin-opensubtitle:1.0.1
    cpu_shares: 30
    container_name: metapluginopensubtitles-plugin
    # Hard RAM cap, swap disabled (memswap_limit == mem_limit) → OOM
    # instead of swap. Mirrors the limits the bundled sidecars run with.
    mem_limit: 256m
    memswap_limit: 256m
    hostname: metapluginopensubtitles-plugin
    restart: unless-stopped
    user: "0:0"
    expose:
      - 8080
    environment:
      # Where the plugin writes the artefacts it produces (posters, stills,
      # extracted subtitles) — the shared MetaCore's WebDAV over `pcs`.
      # LOAD-BEARING: the published images resolve WebDAV from this var, and
      # without it they log "WebDAV client unavailable" and silently write
      # nothing. Every record then fails MetaWatch's poster gate.
      WEBDAV_URL: "http://metacore-app:9000/webdav"
      TZ: "$TZ"
    networks:
      - metapluginopensubtitles
      - pcs

  # ---------------------------------------------------------------------------
  # AppShield gate — the plugin's `/manifest` behind Yundera OIDC SSO.
  # container_name == subdomain prefix (the auth-registrar derives the client_id
  # from it). Consumers still reach the plugin directly on `pcs`; this gate
  # exists so `/process` and `/configure` are never reachable from the internet
  # without a session.
  # ---------------------------------------------------------------------------
  metapluginopensubtitles:
    image: ghcr.io/yundera/appshield:2.0.9
    cpu_shares: 80
    container_name: metapluginopensubtitles
    hostname: metapluginopensubtitles
    restart: unless-stopped
    user: "0:0"
    expose:
      - 80
    environment:
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      REDIRECT_HOST_SUFFIXES: "${APP_DOMAIN},${APP_PUBLIC_IP_DASH}.nip.io,${APP_PUBLIC_IP_DASH}.sslip.io"
      BACKEND_HOST: "metapluginopensubtitles-plugin"
      BACKEND_PORT: "8080"
      LISTEN_PORT: "80"
    labels:
      caddy_0: metapluginopensubtitles-${APP_DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      caddy_1: metapluginopensubtitles-${APP_PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.reverse_proxy: "{{upstreams 80}}"
      caddy_2: metapluginopensubtitles-${APP_PUBLIC_IP_DASH}.sslip.io
      caddy_2.reverse_proxy: "{{upstreams 80}}"
    depends_on:
      - metapluginopensubtitles-plugin
    networks:
      - metapluginopensubtitles
      - pcs

networks:
  metapluginopensubtitles:
    name: metapluginopensubtitles
    driver: bridge
  pcs:
    name: ${APP_NET:-pcs}
    external: true

x-casaos:
  architectures:
    - amd64
    - arm64
  author: Worph Team
  category: Developer
  developer: Aptero Team
  main: metapluginopensubtitles
  webui_port: 80
  index: /manifest

  description:
    en_us: |
      **The `opensubtitles` enrichment plugin for MetaMesh, as its own app.**

      Fetches subtitle sidecars from **OpenSubtitles** for videos that have none, and links them to the video.

      **Bring your own account.** The plugin stores no credentials: the caller
      POSTs its own API key, username and password to `/configure` before each
      use. Without them it soft-skips.

      **Headless.** It answers the plugin HTTP contract — `/manifest`, `/health`,
      `/configure`, `/process` — and has no dashboard; this tile opens its
      `/manifest`. Point a consumer at `http://metapluginopensubtitles-plugin:8080`.

      **Who can use it today:** a **MetaFeeder** app, through its
      `OPENSUBTITLES_PLUGIN_URL` setting — one shared copy instead of one bundled per feeder.

      **Not a MetaSort plugin.** MetaSort starts its own plugin containers from
      `plugins.yml` and has no slot for a plugin URL.
    fr_fr: |
      **Le plugin d'enrichissement `opensubtitles` de MetaMesh, en app autonome.**

      Récupère des sous-titres depuis **OpenSubtitles** pour les vidéos qui n'en ont pas et les relie à la vidéo.

      **Sans interface.** Il répond au contrat HTTP des plugins — `/manifest`,
      `/health`, `/configure`, `/process` — et n'a pas de tableau de bord ; cette
      tuile ouvre son `/manifest`. Dirigez un consommateur vers
      `http://metapluginopensubtitles-plugin:8080`.

      **Ce n'est pas un plugin MetaSort** : MetaSort démarre ses propres
      conteneurs de plugins depuis `plugins.yml` et n'accepte pas d'URL.
  tagline:
    en_us: Fetches missing subtitles from OpenSubtitles
    fr_fr: Récupère les sous-titres manquants depuis OpenSubtitles

  title:
    en_us: MetaPlugin · OpenSubtitles

  icon: https://cdn.jsdelivr.net/gh/Worph/MetaAppStore@main/Apps/MetaPluginOpenSubtitles/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/Worph/MetaAppStore@main/Apps/MetaPluginOpenSubtitles/thumbnail.png

  store_app_id: metapluginopensubtitles
  is_uncontrolled: false

  tips:
    before_install:
      en_us: |
        **What this is for:** running the `opensubtitles` plugin **once, shared**, instead of
        one bundled copy inside every app that needs it.

        **After installing:** set `OPENSUBTITLES_PLUGIN_URL` to `http://metapluginopensubtitles-plugin:8080` in the
        MetaFeeder app that should use it, then restart that feeder. Left unset,
        the feeder keeps using its own bundled copy.

        **It is not a MetaSort plugin.** MetaSort spawns its own plugin containers
        from `plugins.yml` (`image:`), with no URL slot — installing this app does
        not add `opensubtitles` to MetaSort.

        **Requires MetaCore** on the same box: this plugin writes what it
        produces to MetaCore's WebDAV (`http://metacore-app:9000/webdav`).

        **Authentication:** the `/manifest` page is protected by Yundera's Authelia
        (OIDC). Consumers on the `pcs` network bypass the gate by design.

# Maison (Yundera dashboard) configuration. Read in preference to x-casaos.
# schema_version 2 is required for `folders`: an older Maison refuses the app
# outright rather than starting it without its directories.
x-compose-app:
  schema_version: 2
  # Same string as the caddy_0 label, so the tile link and the route agree.
  webui-host: metapluginopensubtitles-${domain}
  webui-path: "/manifest"
