name: metafeedermusicbrainz

# =============================================================================
# MetaFeeder · MusicBrainz — the MUSIC IDENTITY tier for MetaMesh.
#
# MusicBrainz names the *work*: album, artist, release group, cover art (via the
# Cover Art Archive) and the ids the audio tiers anchor on. Keyless, no config.
# It serves no audio and must not — pair it with a bytes tier
# (Internet Archive, Jamendo) or the delegated YouTube tier.
#
# ⚠ MusicBrainz publishes a hard 1 request/second ceiling, enforced per source
# IP — one misbehaving feeder blocks every peer behind the same NAT. The rate
# limiter is in the image; there is no knob here and there should not be.
#
# It needs, over the shared `pcs` network:
#   - the **MetaGateway** app — which must list this feeder's URL
#     (`http://metafeedermusicbrainz-feeder:8080`) in its feeders config so it gets discovered.
#     Discovery is startup-only, so restart the gateway afterwards.
#
# Everything is scoped under the `metafeedermusicbrainz-*` prefix + the per-stack `metafeedermusicbrainz` network +
# /DATA/AppData/metafeedermusicbrainz/ data root, so it installs beside the other Meta* apps with
# zero collisions.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # metafeedermusicbrainz-feeder — the feeder itself. The gateway reaches it directly on
  # `pcs` for discovery/query/compute; the human configures it
  # from the MetaGateway dashboard (configure panel).
  # ---------------------------------------------------------------------------
  metafeedermusicbrainz-feeder:
    image: ghcr.io/worph/meta-feeder-musicbrainz:1.1.2
    cpu_shares: 30
    container_name: metafeedermusicbrainz-feeder
        # Identity tier: JSON in, cards out, nothing buffered. Swap disabled
        # (memswap_limit == mem_limit) → OOM instead of thrash.
    mem_limit: 256m
    memswap_limit: 256m
    hostname: metafeedermusicbrainz-feeder
    restart: unless-stopped
    user: "0:0"
    expose:
      - 8080
    environment:
      RUST_LOG: "info,meta_feeder=info,musicbrainz_feeder=info"
      META_FEEDER_STATE_DIR: "/data/meta-feeder"
      TZ: "$TZ"
    volumes:
      # Persist feeder config.json + redb cache so it survives recreate.
      - ${DATA_ROOT:-/DATA}/AppData/metafeedermusicbrainz/state:/data/meta-feeder:rw
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - pcs
networks:
  pcs:
    name: ${APP_NET:-pcs}
    external: true

x-casaos:
  architectures:
    - amd64
    - arm64
  author: Worph Team
  category: Media
  developer: Aptero Team

  description:
    en_us: |
      **The music identity tier for MetaMesh.**

      MetaFeeder · MusicBrainz names the *work* — album, artist, release group,
      cover art from the Cover Art Archive, and the ids every audio tier anchors
      on. Keyless and cheap.

      It serves **no audio**. Pair it with a bytes tier — **MetaFeeder · Internet
      Archive** or **MetaFeeder · Jamendo** — or with the delegated **MetaFeeder ·
      YouTube**: recordings matched to one MusicBrainz work converge on a single
      album page instead of fragmenting into one tile per spelling.
      **Requires:** **MetaGateway** — its meta-core stores the resolved records and
      announces them to the swarm. The gateway must list this feeder in its config.
    fr_fr: |
      **La couche d'identité musicale de MetaMesh.**

      MetaFeeder · MusicBrainz nomme l'*œuvre* — album, artiste, groupe de sortie,
      pochette (Cover Art Archive) et les identifiants sur lesquels s'ancrent les
      couches audio. Sans clé.

      Il ne sert **aucun audio** : à associer à **MetaFeeder · Internet Archive**,
      **MetaFeeder · Jamendo** ou **MetaFeeder · YouTube**. **Nécessite** l'app
      **MetaGateway**.
  tagline:
    en_us: MusicBrainz — the music identity tier for MetaMesh
    fr_fr: MusicBrainz — la couche d'identité musicale de MetaMesh

  title:
    en_us: MetaFeeder · MusicBrainz

  icon: https://cdn.jsdelivr.net/gh/Worph/MetaAppStore@main/Apps/MetaFeederMusicBrainz/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/Worph/MetaAppStore@main/Apps/MetaFeederMusicBrainz/thumbnail.png

  store_app_id: metafeedermusicbrainz
  is_uncontrolled: false

  tips:
    before_install:
      en_us: |
        **Install order:** install **MetaGateway** first (its meta-core stores and
        announces what this feeder finds).

        **After installing this app:** in **MetaGateway**, add this feeder from the
        dashboard's *Add a feeder* box — name `musicbrainz-feeder`, URL `http://metafeedermusicbrainz-feeder:8080`.
        The gateway restarts itself: feeder discovery is startup-only.
        No API key. For anything playable, also install a bytes tier
        (**MetaFeeder · Internet Archive**, **MetaFeeder · Jamendo**) or
        **MetaFeeder · YouTube**. Pairs with **MetaListen**.
        **No web UI of its own:** configure it from the **MetaGateway** dashboard → this feeder → *configure* (the gateway proxies this feeder's config page, behind the gateway's login).

# Maison (Yundera dashboard) configuration. Read in preference to x-casaos.
# schema_version 2 is required for `folders`: an older Maison refuses the app
# outright rather than starting it without its directories.
x-compose-app:
  schema_version: 2
  # Created and chowned by Maison before any image is pulled, before any hook
  # runs and before the containers start — on the first boot and every one after.
  # Compose would otherwise create a missing bind source as a root-owned dir.
  folders:
    - path: /DATA/AppData/metafeedermusicbrainz/state
      user: $PUID
      group: $PGID
